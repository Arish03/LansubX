services:
  postgres:
    image: postgres:16-alpine
    container_name: lansubx-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lansubx}
      POSTGRES_USER: ${POSTGRES_USER:-lansubx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lansubx_password_secure}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lansubx} -d ${POSTGRES_DB:-lansubx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lansubx-redis-prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lansubx-mosquitto-prod
    restart: always
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_prod_data:/mosquitto/data
    entrypoint:
      - "sh"
      - "-c"
      - |
        touch /mosquitto/data/passwd
        if ! grep -q "^${MQTT_BACKEND_USERNAME:-backend}:" /mosquitto/data/passwd 2>/dev/null; then
          mosquitto_passwd -b /mosquitto/data/passwd "${MQTT_BACKEND_USERNAME:-backend}" "${MQTT_BACKEND_PASSWORD:-backend_secure_pass_123}"
        fi
        if ! grep -q "^${MQTT_GATEWAY_USERNAME:-gateway}:" /mosquitto/data/passwd 2>/dev/null; then
          mosquitto_passwd -b /mosquitto/data/passwd "${MQTT_GATEWAY_USERNAME:-gateway}" "${MQTT_GATEWAY_PASSWORD:-gateway_secure_pass_123}"
        fi
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -u ${MQTT_BACKEND_USERNAME:-backend} -P ${MQTT_BACKEND_PASSWORD:-backend_secure_pass_123} -i prod_healthcheck || exit 0"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lansubx-backend-prod
    restart: always
    env_file:
      - .env
    ports:
      - "6500:6500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 6500 --workers ${WEB_CONCURRENCY:-1}"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:6500/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lansubx-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-6001}:6001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:6500}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:6500}
    depends_on:
      - backend

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: lansubx-gateway-prod
    profiles:
      - gateway
    restart: always
    env_file:
      - .env
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    depends_on:
      - mosquitto

volumes:
  postgres_prod_data:
  redis_prod_data:
  mosquitto_prod_data:
