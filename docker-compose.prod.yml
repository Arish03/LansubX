services:
  postgres:
    image: postgres:16-alpine
    container_name: lansubx-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lansubx-redis-prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lansubx-mosquitto-prod
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_prod_data:/mosquitto/data
    entrypoint:
      - "sh"
      - "-c"
      - |
        touch /mosquitto/data/passwd
        if ! grep -q "^${MQTT_BACKEND_USERNAME}:" /mosquitto/data/passwd 2>/dev/null; then
          mosquitto_passwd -b /mosquitto/data/passwd "${MQTT_BACKEND_USERNAME}" "${MQTT_BACKEND_PASSWORD}"
        fi
        if ! grep -q "^${MQTT_GATEWAY_USERNAME}:" /mosquitto/data/passwd 2>/dev/null; then
          mosquitto_passwd -b /mosquitto/data/passwd "${MQTT_GATEWAY_USERNAME}" "${MQTT_GATEWAY_PASSWORD}"
        fi
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lansubx-backend-prod
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lansubx-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  mosquitto_prod_data:
